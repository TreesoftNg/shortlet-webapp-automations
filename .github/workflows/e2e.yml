name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run page checks
        env:
          CI: true
          CUSTOMER_BASE_URL: ${{ secrets.CUSTOMER_BASE_URL }}
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TENANT_SLUG: ${{ secrets.TENANT_SLUG }}
        run: |
          npx playwright test \
            tests/customer/home.spec.ts \
            tests/customer/checkout.spec.ts \
            --project=admin-login
          npx playwright test --project=admin \
            tests/admin/dashboard.spec.ts \
            tests/admin/properties.spec.ts \
            tests/admin/payments.spec.ts \
            tests/admin/settings.spec.ts \
            --grep-invert "creates an E2E"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  critical:
    name: Playwright critical
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run sign-in and admin checks
        env:
          CI: true
          CUSTOMER_BASE_URL: ${{ secrets.CUSTOMER_BASE_URL }}
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          PROPERTY_SLUG: ${{ secrets.PROPERTY_SLUG }}
          TENANT_SLUG: ${{ secrets.TENANT_SLUG }}
        run: >
          npx playwright test
          tests/customer/signup.spec.ts
          tests/customer/sign-in.spec.ts
          tests/admin/bookings.spec.ts
          tests/admin/customers.spec.ts
          tests/admin/staff.spec.ts
          tests/admin/availability.spec.ts
          tests/admin/properties.spec.ts

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-critical
          path: |
            playwright-report/
            test-results/
          retention-days: 7
